services:
  agent:
    build: .
    image: gladys-agent
    container_name: gladys-agent
    network_mode: host
    env_file:
      - ./workspace/.env
    volumes:
      - ./workspace/home:/workspace
      - ./workspace/.pi:/root/.pi
      - ./docker/daemon.toml:/etc/gladys/daemon.toml:ro
      - ${GLADYS_DAEMON_BIN:-./target/release/gladys-daemon}:/usr/local/bin/gladys-daemon:ro
    working_dir: /workspace
    environment:
      HOME: /root
    restart: unless-stopped
